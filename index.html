<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Polo Oeste | Destinos</title>


    <!-- =========================================
         FUENTE CORPORATIVA
    ========================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         HOJA DE ESTILOS
    ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         FONDO
    ========================================== -->

    <div class="background">

        <div class="triangle triangle-1"></div>

        <div class="triangle triangle-2"></div>

        <div class="triangle triangle-3"></div>

        <div class="triangle triangle-4"></div>

        <div class="triangle triangle-5"></div>

        <div class="triangle triangle-6"></div>


        <div class="background-circle circle-1"></div>

        <div class="background-circle circle-2"></div>

        <div class="background-circle circle-3"></div>


        <div class="texture"></div>

    </div>



    <!-- =========================================
         PÁGINA
    ========================================== -->

    <div class="page">


        <!-- =====================================
             ENCABEZADO
        ====================================== -->

        <header class="header">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="logo.png"
                    alt="Polo Oeste"
                    class="logo"
                >

            </div>


            <!-- TÍTULO -->

            <div class="header-title">

                <h1>
                    Bienvenido a Polo Oeste
                </h1>

                <p>
                    Seleccione su destino
                </p>

            </div>


        </header>



        <!-- =====================================
             DESTINOS
        ====================================== -->

        <main class="main-container">

            <div
                id="destinos"
                class="destinos-grid"
            >

            </div>

        </main>



        <!-- =====================================
             PIE DE PÁGINA
        ====================================== -->

        <footer class="footer">

            <div class="footer-line"></div>

            <p>
                Polo Oeste
            </p>

            <div class="footer-line"></div>

        </footer>


    </div>



    <!-- =========================================
         MODAL DE DESTINO
    ========================================== -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div class="modal-card">

            <button
                class="modal-close"
                id="modalClose"
                aria-label="Cerrar"
            >
                &times;
            </button>

            <img
                class="modal-image"
                id="modalImage"
                src=""
                alt=""
            >

            <div class="modal-body">

                <h2
                    class="modal-title"
                    id="modalTitle"
                ></h2>

                <button
                    class="modal-go-button"
                    id="modalGoButton"
                >
                    Ir
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
